<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Restarting...</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,sans-serif;background:#0f1117;color:#e2e8f0;display:flex;align-items:center;justify-content:center;min-height:100vh}
.box{text-align:center;padding:2rem}
h1{font-size:1.5rem;margin-bottom:.75rem;color:#f8fafc}
p{color:#94a3b8;font-size:.9rem;margin-bottom:1.5rem}
.spinner{width:2.5rem;height:2.5rem;border:3px solid #2d3748;border-top-color:#3b82f6;border-radius:50%;animation:spin 1s linear infinite;margin:0 auto 1rem}
@keyframes spin{to{transform:rotate(360deg)}}
#countdown{color:#3b82f6;font-weight:600}
</style>
</head>
<body>
<div class="box">
  <div class="spinner"></div>
  <h1>Restarting Device</h1>
  <p>Reconnecting in <span id="countdown">8</span> seconds...</p>
</div>
<script>
var n = 8;
var el = document.getElementById('countdown');
var t = setInterval(function() {
  n--;
  el.textContent = n;
  if (n <= 0) {
    clearInterval(t);
    window.location.href = '/';
  }
}, 1000);
</script>
</body>
</html>
