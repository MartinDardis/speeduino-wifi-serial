[env:esp32-s3]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200

board_build.partitions = min_spiffs.csv

# Note: ElegantOTA >= 3.x requires esp32async/ESPAsyncWebServer (the community-maintained
# fork of mathieucarbou/ESPAsyncWebServer). Both forks are API-compatible but must NOT
# be mixed in the same build or the linker will see duplicate symbols.
# By explicitly listing esp32async here, PlatformIO installs only one version.
lib_deps =
    esp32async/ESPAsyncWebServer @ ^3.7.3
    adafruit/Adafruit NeoPixel @ ^1.12.3
    frankboesing/FastCRC @ ^1.41
    ayushsharma82/ElegantOTA @ ^3.1.0

build_flags =
    -D ARDUINO_USB_CDC_ON_BOOT=1
    -D ELEGANTOTA_USE_ASYNC_WEBSERVER=1
    -fpermissive
